name: Check and deploy Traction PWA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm test
      - run: npm run check
      - name: Prepare public files
        run: |
          mkdir dist
          cp index.html manifest.webmanifest sw.js dist/
          cp -r css js data icons dist/
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Wait for deployment artifact metadata
        env:
          PAGES_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import { setTimeout } from 'node:timers/promises';
          const url = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}/artifacts`;
          for (let attempt = 0; attempt < 8; attempt++) {
            const response = await fetch(url, {headers: {
              Authorization: `Bearer ${process.env.PAGES_TOKEN}`,
              Accept: 'application/vnd.github+json'
            }});
            if (!response.ok) throw new Error(`Artifact check failed (${response.status})`);
            const data = await response.json();
            if (data.artifacts?.some(a => a.name === 'github-pages' && !a.expired)) {
              console.log('Deployment artifact is available.');
              process.exit(0);
            }
            await setTimeout(3000);
          }
          throw new Error('Deployment artifact metadata is not available yet.');
          JS
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
