<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#101b30" />
    <meta
      name="description"
      content="Your training, in motion. An offline workout journal."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>Traction — Workout Journal</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="stylesheet" href="./css/routines.css" />
    <script src="./js/vendor/supabase.js"></script>
    <script type="module" src="./js/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#dashboard"
          ><span class="brand-mark" aria-hidden="true">T</span>traction<span
            class="brand-dot"
            >.</span
          ></a
        >
        <p class="sidebar-label">YOUR TRAINING SPACE</p>
        <nav aria-label="Main navigation">
          <a href="#dashboard" data-page="dashboard"
            ><span aria-hidden="true">▦</span> Overview</a
          >
          <a href="#workouts" data-page="workouts"
            ><span aria-hidden="true">＋</span> Workouts</a
          >
          <a href="#routines" data-page="routines"
            ><span aria-hidden="true">▥</span> Routines</a
          >
          <a href="#history" data-page="history"
            ><span aria-hidden="true">◷</span> History</a
          >
        </nav>
        <div class="sidebar-bottom">
          <span id="connection">Available offline</span>
          <p>Your progress. Your pace.</p>
          <small>TRACTION / PWA</small>
        </div>
      </aside>
      <div class="workspace">
        <header class="topbar">
          <a
            class="brand header-brand"
            href="#dashboard"
            aria-label="Traction home"
            ><span class="brand-mark" aria-hidden="true">T</span>traction<span
              class="brand-dot"
              >.</span
            ></a
          >
          <div class="row">
            <button id="install" class="quiet" hidden>Install app</button
            ><a
              class="header-icon"
              href="#settings"
              data-page="settings"
              aria-label="Settings"
              title="Settings"
              ><svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path
                  d="m9 3-1 3-3 1-2 3 2 2-1 3 3 2 1 3h4l1-3 3-1 2-3-2-2 1-3-3-2-1-3Z"
                />
                <circle cx="10.5" cy="11.5" r="3" /></svg></a
            ><a
              class="header-icon"
              href="#profile"
              data-page="profile"
              aria-label="Profile"
              title="Profile"
              ><svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <circle cx="12" cy="7" r="4" />
                <path d="M4 21v-2a8 8 0 0 1 16 0v2Z" /></svg
            ></a>
          </div>
        </header>
        <main id="main" tabindex="-1">
          <p class="empty">Opening your training journal…</p>
        </main>
        <footer>Built for the work you put in.</footer>
      </div>
    </div>
    <dialog id="modal" aria-labelledby="modal-title"></dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <noscript
      >Traction needs JavaScript enabled to save workouts on this
      device.</noscript
    >
  </body>
</html>
